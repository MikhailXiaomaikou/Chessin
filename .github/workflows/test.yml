name: Test
on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Sync node version and setup cache
        uses: actions/setup-node@v3
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint:ci

      - name: Run tests
        run: pnpm test

  # Chessin: Rust regression net (plan §6 S0). Upstream never ran cargo in CI.
  rust:
    name: Rust (cargo test + clippy)
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Same package set (and webkit pin) as release.yml, so that CI compiles
      # against the same system libraries the release build does.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0=2.44.0-2 \
            libwebkit2gtk-4.1-dev=2.44.0-2 \
            libjavascriptcoregtk-4.1-0=2.44.0-2 \
            libjavascriptcoregtk-4.1-dev=2.44.0-2 \
            gir1.2-javascriptcoregtk-4.1=2.44.0-2 \
            gir1.2-webkit2-4.1=2.44.0-2 \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # `tauri::generate_context!()` embeds `frontendDist` ("../dist") at compile
      # time and panics if the directory is missing (the default `custom-protocol`
      # feature is on for cargo test/clippy). A placeholder is enough: no frontend
      # build is needed to compile and test the Rust side.
      - name: Create placeholder frontend dist
        run: |
          mkdir -p dist
          printf '<!doctype html><title>placeholder</title>\n' > dist/index.html

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      # Non-blocking for now: upstream was never gated on clippy, so the first
      # runs will report pre-existing warnings. `-D warnings` keeps the step red
      # (visible) when there is anything to fix; flip continue-on-error off once
      # the backlog is cleared.
      - name: Run clippy (non-blocking)
        working-directory: src-tauri
        continue-on-error: true
        run: cargo clippy --locked --all-targets -- -D warnings
