[package]
name = "en-croissant"
version = "0.15.1"
description = "A Modern Chess Database"
authors = ["Francisco Salgueiro <fgcdbs@gmail.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/franciscoBSalgueiro/en-croissant"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.10.2", features = ["protocol-asset"] }
zip = "2.1.6"
tokio = { version = "1.33", features = ["full"] }
futures-util = "0.3.24"
flate2 = "1"
reqwest = { version = "0.12.5", features = ["stream", "blocking", "json"] }
shakmaty = "0.27.1"
pgn-reader = "0.26.0"
csv = "1.1.6"
lazy_static = "1.4.0"
btoi = "0.4.2"
rusqlite = { version = "0.28.0", features = ["bundled"] }
bzip2 = "0.4.3"
zstd = "0.13"
diesel = { version = "2.0.2", features = ["sqlite", "returning_clauses_for_sqlite_3_35", "r2d2"] }
rayon = "1.6.1"
chrono = "0.4.23"
derivative = "2.2.0"
dashmap = "6.0.1"
once_cell = "1.17.1"
rand = "0.8.5"
vampirc-uci = { path = "vendor/vampirc-uci", features = ["specta", "serde"] }
tempfile = "3.6.0"
specta = { version = "^2.0.0-rc.20", features = ["derive"] }
tauri-specta = { version = "^2.0.0-rc.20", features = ["derive", "typescript"] }
strsim = "0.11.0"
thiserror = "2"
log = "0.4.20"
oauth2 = "4.4.2"
axum = "0.6.20"
tar = "0.4.40"
sysinfo = "0.29.10"
governor = "0.6.3"
nonzero_ext = "0.3.0"
specta-typescript = "0.0.9"
tauri-plugin-http = "2.5.7"
tauri-plugin-fs = "2.4.5"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-os = "2.3.2"
tauri-plugin-cli = "2.4.1"
tauri-plugin-updater = "2.10.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-log = "2.8.0"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2.0.0"
tauri-plugin-single-instance = { version = "2.0.0", features = ["deep-link"] }
memmap2 = "0.9"
rkyv = { version = "0.8", features = ["bytecheck"] }
polyglot-book-rs = "0.1.0"
sha2 = "0.10"
tauri-plugin-chessin = { workspace = true }

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]

# Chessin overlay: this manifest is also the workspace root. The app package above
# stays `en-croissant`; Chessin's own code lives in `crates/*` (see docs/seams.md).
[workspace]
members = ["crates/*"]
# Vendored third-party code (formerly a git dependency, pinned at upstream rev
# 0d2b70d1e9cc6fb2159717a7252e1e080c25bd53). It is a path dependency, not a
# member, so `cargo test/clippy --workspace` only cover Chessin's own crates.
exclude = ["vendor/vampirc-uci"]

[workspace.dependencies]
chessin-cb = { path = "crates/chessin-cb" }
chessin-core = { path = "crates/chessin-core" }
chessin-index = { path = "crates/chessin-index" }
tauri-plugin-chessin = { path = "crates/tauri-plugin-chessin" }
tauri = "2.10.2"
tauri-plugin = "2"
specta = { version = "^2.0.0-rc.20", features = ["derive"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "^2.0.0-rc.20", features = ["derive", "typescript"] }
# Same version and features as the app's own `rusqlite` above, so only one
# `libsqlite3-sys` is linked into the binary.
rusqlite = { version = "0.28", features = ["bundled"] }
trash = "5"
dirs = "6"
# Same versions the app already resolves (see Cargo.lock), shared by `chessin-index`.
shakmaty = "0.27.1"
memmap2 = "0.9"
rayon = "1.9"
crc32fast = "1.4"
