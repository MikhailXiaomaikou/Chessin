"$schema" = "schemas/schema.json"

[default]
description = """
Default permissions for the Chessin plugin.

#### Granted Permissions

Every Chessin command is allowed; the plugin is only ever loaded by the Chessin
main window (see `src-tauri/capabilities/main.json`).

"""

permissions = [
    "allow-chessin-ping",
    "allow-cbh-to-pgn",
    "allow-store-get",
    "allow-store-set",
    "allow-store-delete",
    "allow-doc-put",
    "allow-doc-get",
    "allow-doc-list",
    "allow-doc-delete",
    "allow-doc-versions",
    "allow-doc-restore-version",
    "allow-job-upsert",
    "allow-job-list",
    "allow-job-delete",
    "allow-job-prune",
    "allow-eval-cache-get",
    "allow-eval-cache-put",
    "allow-card-upsert",
    "allow-card-list",
    "allow-card-get",
    "allow-card-delete",
    "allow-card-log",
    "allow-card-stats",
    "allow-move-to-trash",
    "allow-scan-chessbase",
]
