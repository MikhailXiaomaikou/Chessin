[package]
name = "chessin-cb"
version = "0.1.0"
description = "Clean-room, read-only reader for ChessBase CBH (v1) databases that emits PGN"
license = "GPL-3.0-only"
repository = "https://github.com/MikhailXiaomaikou/Chessin"
edition = "2021"
publish = false

[dependencies]
shakmaty = "0.27.1"
encoding_rs = "0.8"
thiserror = "2"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
specta = { workspace = true }

[dev-dependencies]
tempfile = "3"
