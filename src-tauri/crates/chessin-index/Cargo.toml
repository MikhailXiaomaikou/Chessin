[package]
name = "chessin-index"
version = "0.1.0"
description = "Position index (`<db>.db3.cpi` sidecar) over Chessin's SQLite game databases: opening-tree postings, game meta and pawn-structure signatures"
license = "GPL-3.0-only"
repository = "https://github.com/MikhailXiaomaikou/Chessin"
edition = "2021"
publish = false

[dependencies]
shakmaty = { workspace = true }
rusqlite = { workspace = true }
memmap2 = { workspace = true }
rayon = { workspace = true }
crc32fast = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
specta = { workspace = true }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
